<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FisherConnect – Smart Fishing & Fisherman Support Platform</title>
    <style>
      :root {
        --navy: #0a1929;
        --navy-light: #132f4c;
        --ocean: #0d6b7d;
        --ocean-light: #1a8fa0;
        --teal: #14b8a6;
        --white: #f0f7f9;
        --surface: #ffffff;
        --surface-alt: #e8f4f8;
        --danger: #e74c3c;
        --warning: #f39c12;
        --success: #27ae60;
        --text: #1a1a2e;
        --text-light: #555;
        --border: #d0e4ec;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
        --radius: 12px;
        --radius-sm: 8px;
        --transition: 0.2s ease;
        --sidebar-w: 250px;
        --header-h: 60px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #eaf4f8;
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #b0c8d4;
        border-radius: 3px;
      }
      /* Layout */
      .app-layout {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: var(--sidebar-w);
        background: var(--navy);
        color: #c8dbe8;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 100;
        display: flex;
        flex-direction: column;
        transition: transform var(--transition);
        overflow-y: auto;
      }
      .sidebar-logo {
        padding: 20px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.25rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.3px;
      }
      .sidebar-logo .logo-icon {
        width: 38px;
        height: 38px;
        background: var(--teal);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
      }
      .sidebar-nav {
        flex: 1;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-radius: var(--radius-sm);
        color: #b0c8d8;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all var(--transition);
        cursor: pointer;
      }
      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .sidebar-nav a.active {
        background: var(--ocean);
        color: #fff;
        font-weight: 600;
      }
      .sidebar-nav .nav-section {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #6088a0;
        padding: 16px 16px 6px;
        font-weight: 700;
      }
      .main-content {
        margin-left: var(--sidebar-w);
        flex: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: var(--header-h);
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        position: sticky;
        top: 0;
        z-index: 50;
        gap: 16px;
      }
      .topbar .page-title {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--navy);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .topbar-actions .user-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--navy);
        cursor: pointer;
      }
      .topbar-actions .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--ocean);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
      }
      .btn {
        padding: 9px 18px;
        border-radius: var(--radius-sm);
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        transition: all var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        font-family: inherit;
      }
      .btn-primary {
        background: var(--ocean);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--ocean-light);
        box-shadow: var(--shadow);
      }
      .btn-teal {
        background: var(--teal);
        color: #fff;
      }
      .btn-teal:hover {
        opacity: 0.9;
        box-shadow: var(--shadow);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-danger:hover {
        opacity: 0.9;
      }
      .btn-outline {
        background: transparent;
        border: 2px solid var(--ocean);
        color: var(--ocean);
      }
      .btn-outline:hover {
        background: var(--ocean);
        color: #fff;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 0.78rem;
      }
      .btn-lg {
        padding: 13px 28px;
        font-size: 1rem;
        border-radius: var(--radius);
      }
      .content-area {
        padding: 24px 28px;
        flex: 1;
      }
      .card {
        background: #fff;
        border-radius: var(--radius);
        padding: 22px 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        transition: box-shadow var(--transition);
      }
      .card:hover {
        box-shadow: var(--shadow-lg);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .card-header h3 {
        font-size: 1.05rem;
        color: var(--navy);
        font-weight: 700;
      }
      .grid {
        display: grid;
        gap: 20px;
      }
      .grid-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .stat-card {
        background: #fff;
        border-radius: var(--radius);
        padding: 20px 22px;
        box-shadow: var(--shadow);
        border-left: 4px solid var(--ocean);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .stat-card .stat-value {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--navy);
      }
      .stat-card .stat-label {
        font-size: 0.82rem;
        color: var(--text-light);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stat-card.teal {
        border-left-color: var(--teal);
      }
      .stat-card.warning {
        border-left-color: var(--warning);
      }
      .stat-card.danger {
        border-left-color: var(--danger);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      table th,
      table td {
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      table th {
        background: #f5f9fb;
        font-weight: 700;
        color: var(--navy);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      table tr:hover td {
        background: #f9fcfe;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .badge-success {
        background: #d4f5e9;
        color: #1a7a4c;
      }
      .badge-warning {
        background: #fef3cd;
        color: #92600a;
      }
      .badge-info {
        background: #d6f0f7;
        color: #0d6b7d;
      }
      .badge-danger {
        background: #fde8e8;
        color: #a71d2a;
      }
      .badge-pending {
        background: #fff3e0;
        color: #e65100;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        color: var(--navy);
        font-size: 0.85rem;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-family: inherit;
        transition: border-color var(--transition);
        background: #fafcfd;
      }
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--ocean);
        background: #fff;
      }
      .form-row {
        display: flex;
        gap: 16px;
      }
      .form-row .form-group {
        flex: 1;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease;
      }
      .modal {
        background: #fff;
        border-radius: var(--radius);
        padding: 28px;
        max-width: 560px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
      }
      .modal h2 {
        margin-bottom: 16px;
        color: var(--navy);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 300;
        padding: 14px 20px;
        border-radius: var(--radius-sm);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: var(--shadow-lg);
        animation: slideIn 0.3s ease;
        max-width: 400px;
      }
      .toast-success {
        background: var(--success);
      }
      .toast-error {
        background: var(--danger);
      }
      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .hero-section {
        background: linear-gradient(
          135deg,
          #0a1929 0%,
          #0d3b5c 40%,
          #0d6b7d 100%
        );
        color: #fff;
        padding: 60px 40px;
        border-radius: var(--radius);
        text-align: center;
        margin-bottom: 32px;
        position: relative;
        overflow: hidden;
      }
      .hero-section::after {
        content: "";
        position: absolute;
        bottom: -40px;
        left: -40px;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
      }
      .hero-section h1 {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: 8px;
      }
      .hero-section p {
        font-size: 1.1rem;
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto 24px;
      }
      .landing-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 32px;
      }
      .landing-card {
        background: #fff;
        border-radius: var(--radius);
        padding: 28px 22px;
        text-align: center;
        box-shadow: var(--shadow);
        border-top: 4px solid var(--ocean);
        transition: transform var(--transition);
      }
      .landing-card:hover {
        transform: translateY(-4px);
      }
      .landing-card .icon-circle {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #e0f4f8;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }
      .chart-bar {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 160px;
        padding: 0 8px;
      }
      .chart-bar .bar {
        flex: 1;
        background: var(--ocean);
        border-radius: 6px 6px 0 0;
        min-height: 8px;
        transition: height 0.4s ease;
        position: relative;
      }
      .chart-bar .bar .bar-label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7rem;
        color: var(--text-light);
        white-space: nowrap;
      }
      .map-demo {
        background: #d6eaf0;
        border-radius: var(--radius);
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        border: 2px dashed var(--ocean);
      }
      .map-demo .map-marker {
        position: absolute;
        width: 20px;
        height: 20px;
        background: var(--danger);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(231, 76, 60, 0.6);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
        }
        50% {
          box-shadow: 0 0 24px rgba(231, 76, 60, 0.9);
        }
      }
      .sos-btn {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: var(--danger);
        color: #fff;
        font-weight: 900;
        font-size: 1.1rem;
        border: 4px solid #fff;
        box-shadow: 0 0 30px rgba(231, 76, 60, 0.5);
        cursor: pointer;
        transition: all 0.2s;
        animation: pulse-sos 2s infinite;
        letter-spacing: 1px;
      }
      .sos-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 50px rgba(231, 76, 60, 0.8);
      }
      @keyframes pulse-sos {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
        }
        50% {
          box-shadow: 0 0 45px rgba(231, 76, 60, 0.75);
        }
      }
      .invoice-preview {
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        background: #fdfefe;
        font-family: "Courier New", monospace;
      }
      .invoice-preview h3 {
        text-align: center;
        color: var(--navy);
        margin-bottom: 16px;
      }
      .tag {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.73rem;
        font-weight: 600;
        background: #e8f4f8;
        color: var(--ocean);
      }
      @media (max-width: 1024px) {
        .grid-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid-3 {
          grid-template-columns: repeat(2, 1fr);
        }
        .landing-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .sidebar {
          transform: translateX(-100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .main-content {
          margin-left: 0;
        }
      }
      @media (max-width: 640px) {
        .grid-2,
        .grid-3,
        .grid-4,
        .landing-grid {
          grid-template-columns: 1fr;
        }
        .form-row {
          flex-direction: column;
        }
        .hero-section {
          padding: 32px 20px;
        }
        .hero-section h1 {
          font-size: 1.6rem;
        }
        .content-area {
          padding: 16px;
        }
      }
      .hidden {
        display: none !important;
      }
      .text-center {
        text-align: center;
      }
      .mt-2 {
        margin-top: 16px;
      }
      .mb-2 {
        margin-bottom: 16px;
      }
      .gap-2 {
        gap: 16px;
      }
      .flex-wrap {
        flex-wrap: wrap;
      }
      .search-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .search-bar input {
        flex: 1;
        min-width: 200px;
        padding: 10px 14px;
        border: 2px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.82rem;
        border: 2px solid transparent;
        background: #f0f4f7;
        color: var(--text-light);
        transition: all var(--transition);
      }
      .tab.active,
      .tab:hover {
        background: var(--ocean);
        color: #fff;
        border-color: var(--ocean);
      }
    </style>
  </head>

          return document.querySelectorAll(sel);
        }

        function escapeHtml(str) {
          const d = document.createElement("div");
          d.textContent = str;
          return d.innerHTML;
        }

        function formatDate(dt) {
          if (!dt) return "N/A";
          return new Date(dt).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function formatCurrency(n) {
          return (
            "₹" +
            Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 })
          );
        }

          return currentUser ? currentUser.id : null;

        function showToast(msg, type = "success") {
          const existing = $(".toast");
          if (existing) existing.remove();
          const t = document.createElement("div");
          t.className = "toast toast-" + type;
          t.textContent = msg;
          document.body.appendChild(t);
          setTimeout(() => t.remove(), 3000);
        }

          return window.confirm(msg);

        // --- ROUTING ---
        function navigate(page, data = null) {
          currentPage = page;
          renderApp(data);
          // Scroll to top
          window.scrollTo(0, 0);
          // Update active sidebar link
          $$(".sidebar-nav a").forEach((a) => a.classList.remove("active"));
          const activeLink = $(`.sidebar-nav a[data-page="${page}"]`);
          if (activeLink) activeLink.classList.add("active");
        }

        function logout() {
          currentUser = null;
          currentPage = "landing";
          renderApp();
          showToast("Logged out successfully");
        }
        async function handleLogin(email, password) {
          try {
            const data = await apiFetch("/auth/login", {
              method: "POST",
              body: JSON.stringify({ email, password }),
            });
            sessionStorage.setItem("jwt_token", data.token);
            currentUser = {
              id: data.id,
              name: data.name,
              email: email,
              role: data.role,
            };
            sessionStorage.setItem(
              "fisherconnect_session",
              JSON.stringify(currentUser),
            );
            showToast("Welcome, " + currentUser.name + "!");
            if (data.role === "ROLE_ADMIN") navigate("admin-dashboard");
            else if (data.role === "ROLE_FISHERMAN")
              navigate("fisherman-dashboard");
            else if (data.role === "ROLE_BUYER") navigate("buyer-dashboard");
          } catch (err) {
            showToast("Login failed: " + err.message, "error");
          }
        }

        function handleRegister(name, email, password, role, phone) {
          if (db.users.find((u) => u.email === email)) {
            showToast("Email already registered", "error");
            return false;
          }
          const newUser = {
            id: db.nextId.users++,
            email,
            password,
            role,
            name,
            phone,
            createdAt: new Date().toISOString(),
          };
          db.users.push(newUser);
          persistDB(db);
          showToast("Registration successful! Please login.");
          navigate("login");
          return true;
        }

        function restoreSession() {
          const sess = sessionStorage.getItem("fisherconnect_session");
          if (sess) {
            try {
              const parsed = JSON.parse(sess);
              const user = db.users.find((u) => u.id === parsed.id);
              if (user) {
                currentUser = { ...user };
                delete currentUser.password;
                return true;
              }
            } catch (e) {}
          }
          return false;
        }

        function buildFishermanDashboard() {

          const userExpenses = db.expenses.filter((e) => e.userId === uid);
          const totalRevenue = userCatches.reduce(
            (s, c) =>
              s + (c.totalRevenue || c.quantityKg * c.sellingPricePerKg),
            0,
          );
          const totalExpenses = userExpenses.reduce((s, e) => s + e.amount, 0);
          const profit = totalRevenue - totalExpenses;
          const activeTrip = userTrips.find((t) => t.status === "ACTIVE");
          const recentTrips = userTrips.slice(-3).reverse();
          const recentCatches = userCatches.slice(-3).reverse();
          const unreadNotifs = db.notifications.filter(
            (n) => n.userId === uid && !n.read,
          ).length;

          return `
            <div class="grid grid-4">
              <div class="stat-card"><span class="stat-label">Total Trips</span><span class="stat-value">${userTrips.length}</span></div>
              <div class="stat-card teal"><span class="stat-label">Total Catch (kg)</span><span class="stat-value">${userCatches.reduce((s, c) => s + c.quantityKg, 0)}</span></div>
              <div class="stat-card"><span class="stat-label">Revenue</span><span class="stat-value">${formatCurrency(totalRevenue)}</span></div>
              <div class="stat-card warning"><span class="stat-label">Profit</span><span class="stat-value">${formatCurrency(profit)}</span></div>

        function buildEarningsPage() {

          const totalRevenue = catches.reduce(
            (s, c) =>
              s + (c.totalRevenue || c.quantityKg * c.sellingPricePerKg),

          );
          const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
          const profit = totalRevenue - totalExpenses;
          return `
            <div class="grid grid-3">
              <div class="stat-card"><span class="stat-label">Total Revenue</span><span class="stat-value">${formatCurrency(totalRevenue)}</span></div>

              .filter((t) => t.userId === uid)
              .map((t) => {
                const tc = catches.filter((c) => c.tripId === t.id);

                const rev = tc.reduce(
                  (s, c) =>

                );
                const exp = te.reduce((s, e) => s + e.amount, 0);

            <table><tr><th>Species</th><th>Total Qty (kg)</th><th>Avg Price/kg</th><th>Total Revenue</th></tr>${(() => {
              const map = {};
              db.catches.forEach((c) => {
                if (!map[c.species])
                  map[c.species] = { qty: 0, rev: 0, count: 0 };
                map[c.species].qty += c.quantityKg;
                map[c.species].rev +=
                  c.totalRevenue || c.quantityKg * c.sellingPricePerKg;
                map[c.species].count++;
              });
              return Object.entries(map)
                .map(
                  ([s, d]) =>
                    `<tr><td>${escapeHtml(s)}</td><td>${d.qty}</td><td>${formatCurrency(d.rev / d.qty)}</td><td>${formatCurrency(d.rev)}</td></tr>`,

        // ==================== EVENT HANDLERS ====================
        function attachEventListeners() {
          // Login form
          const loginForm = document.getElementById("login-form");
          if (loginForm) {
            loginForm.onsubmit = async function (e) {
              e.preventDefault();
              const email = document.getElementById("login-email").value;
              const password = document.getElementById("login-password").value;
              if (!email || !password) return;
              try {
                const data = await apiFetch("/auth/login", {
                  method: "POST",
                  body: JSON.stringify({ email, password }),
                });
                sessionStorage.setItem("jwt_token", data.token);
                currentUser = {
                  id: data.id,
                  name: data.name,
                  email: email,
                  role: data.role,
                };
                sessionStorage.setItem(
                  "fisherconnect_session",
                  JSON.stringify(currentUser),
                );
                showToast("Welcome, " + currentUser.name + "!");
                if (data.role === "ROLE_ADMIN") navigate("admin-dashboard");
                else if (data.role === "ROLE_FISHERMAN")
                  navigate("fisherman-dashboard");
                else if (data.role === "ROLE_BUYER")
                  navigate("buyer-dashboard");
              } catch (err) {
                showToast("Login failed: " + err.message, "error");
              }
            };
          }
          // Register form
          const registerForm = document.getElementById("register-form");

          if (registerForm) {
            registerForm.onsubmit = async function (e) {
              e.preventDefault();

              const name = document.getElementById("reg-name").value.trim();
              const email = document.getElementById("reg-email").value.trim();
              const phone = document.getElementById("reg-phone").value.trim();
              const password = document.getElementById("reg-password").value;
              const role = document.getElementById("reg-role").value;

              if (!name || !email || !phone || !password || !role) {
                showToast("Please fill all fields", "error");
                return;
              }

              try {
                showToast("Creating your account...");

                const data = await apiFetch("/auth/register", {
                  method: "POST",
                  body: JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone,
                    password: password,
                    role: role,
                  }),
                });

                console.log("Registration response:", data);

                showToast("Registration successful! Please login.");

                setTimeout(() => {
                  navigate("login");
                }, 1000);
              } catch (err) {
                console.error("Registration error:", err);
                showToast("Registration failed: " + err.message, "error");
              }
            };
          }
        }

          const qty = parseFloat(
            prompt(
              `How many kg of ${listing.species}? (Available: ${listing.quantityKg}kg)`,
            ),
          );
          if (!qty || qty <= 0 || qty > listing.quantityKg)
            return showToast("Invalid quantity", "error");
          const totalPrice = qty * listing.pricePerKg;
          if (
            !confirmAction(
              `Order ${qty}kg of ${listing.species} at ${formatCurrency(listing.pricePerKg)}/kg?\nTotal: ${formatCurrency(totalPrice)}`,
            )
          )
            return;
          const order = {
            id: db.nextId.orders++,
            listingId,
            buyerId: getUserId(),
            sellerId: listing.userId,
            quantityKg: qty,
            totalPrice,
            status: "PENDING",
            createdAt: new Date().toISOString(),
          };
          db.orders.push(order);
          listing.quantityKg -= qty;
          if (listing.quantityKg <= 0) listing.status = "SOLD";
          db.notifications.push({
            id: db.nextId.notifications++,
            userId: listing.userId,
            message: `New order for ${listing.species} (${qty}kg)`,
            read: false,
            createdAt: new Date().toISOString(),
          });
          persistDB(db);
          showToast("Order placed! 🎉");
          navigate("buyer-orders");
        };

        window._updateOrderStatus = function (orderId, newStatus) {
          const order = db.orders.find((o) => o.id === orderId);
          if (!order) return;
          order.status = newStatus;
          const listing = db.listings.find((l) => l.id === order.listingId);
          const speciesName = listing ? listing.species : "Fish";
          db.notifications.push({
            id: db.nextId.notifications++,
            userId: order.buyerId,
            message: `Order #${orderId} for ${speciesName} is now ${newStatus}`,
            read: false,
            createdAt: new Date().toISOString(),
          });
          persistDB(db);
          showToast(`Order status updated to ${newStatus}`);
          renderApp();
        };

        window._viewInvoice = function (orderId) {
          const order = db.orders.find((o) => o.id === orderId);
          if (!order) return;
          const listing = db.listings.find((l) => l.id === order.listingId);
          const buyer = db.users.find((u) => u.id === order.buyerId);
          const seller = db.users.find((u) => u.id === order.sellerId);
          const container = $("#invoice-modal-container");
          if (!container) return;
          container.innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
              <div class="modal" style="max-width:600px;">
                <div class="invoice-preview">
                  <h3>🐟 FisherConnect – Invoice</h3>
                  <p><strong>Invoice ID:</strong> INV-${order.id} | <strong>Order ID:</strong> #${order.id}</p>
                  <hr>
                  <p><strong>Buyer:</strong> ${buyer ? escapeHtml(buyer.name) : "N/A"} (${buyer ? escapeHtml(buyer.email) : ""})</p>
                  <p><strong>Seller:</strong> ${seller ? escapeHtml(seller.name) : "N/A"}</p>
                  <p><strong>Fish:</strong> ${listing ? escapeHtml(listing.species) : "N/A"} | <strong>Quantity:</strong> ${order.quantityKg}kg | <strong>Price:</strong> ${formatCurrency(order.totalPrice / order.quantityKg)}/kg</p>
                  <p><strong>Total:</strong> <span style="font-size:1.3rem;font-weight:800;">${formatCurrency(order.totalPrice)}</span></p>
                  <p><strong>Date:</strong> ${formatDate(order.createdAt)} | <strong>Status:</strong> ${order.status}</p>
                  <hr>
                  <p style="text-align:center;font-size:0.8rem;color:#888;">Thank you for using FisherConnect!</p>
                </div>
                <button class="btn btn-outline btn-sm mt-2" onclick="document.querySelector('#invoice-modal-container .modal-overlay').remove()">Close</button>
              </div>
            </div>`;
        };

        window._filterFishListings = function () {
          const search = ($("#fish-search")?.value || "").toLowerCase();
          const sort = $("#fish-sort")?.value || "newest";
          let listings = db.listings.filter((l) => l.status === "ACTIVE");
          if (search)
            listings = listings.filter((l) =>
              l.species.toLowerCase().includes(search),
            );
          if (sort === "price-low")
            listings.sort((a, b) => a.pricePerKg - b.pricePerKg);
          else if (sort === "price-high")
            listings.sort((a, b) => b.pricePerKg - a.pricePerKg);
          else
            listings.sort(
              (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
            );
          const container = $("#fish-listings-container");
          if (container) {
            container.innerHTML = `<table>${
              listings.length === 0
                ? "<tr><td>No matching listings</td></tr>"
                : listings
                    .map((l) => {
                      const seller = db.users.find((u) => u.id === l.userId);
                      return `<tr><td>${escapeHtml(l.species)}</td><td>${l.quantityKg}kg</td><td>${formatCurrency(l.pricePerKg)}/kg</td><td>${seller ? escapeHtml(seller.name) : "Unknown"}</td><td>${escapeHtml(l.description || "")}</td><td><button class="btn btn-sm btn-teal" onclick="window._placeOrder(${l.id})">Order</button></td></tr>`;
                    })
                    .join("")
            }</table>`;
          }
        };

        window._markRead = function (notifId) {
          const n = db.notifications.find((x) => x.id === notifId);
          if (n) {
            n.read = true;
            persistDB(db);
            renderApp();
          }
        };

        window._markAllRead = function () {
          db.notifications
            .filter((n) => n.userId === getUserId())
            .forEach((n) => (n.read = true));
          persistDB(db);
          showToast("All notifications marked as read");
          renderApp();
        };

        // --- INITIALIZATION ---
        function init() {
          // Try to restore session
          if (restoreSession()) {
            const role = getUserRole();
            if (role === "ROLE_ADMIN") currentPage = "admin-dashboard";
            else if (role === "ROLE_FISHERMAN")
              currentPage = "fisherman-dashboard";
            else if (role === "ROLE_BUYER") currentPage = "buyer-dashboard";
          } else {
            currentPage = "landing";
          }
          renderApp();
        }

        // Expose for inline handlers
        window._navigate = navigate;
        window._logout = logout;
        window._handleLogin = handleLogin;
        window._handleRegister = handleRegister;
        window._showToast = showToast;
        window._confirmAction = confirmAction;
        window._formatCurrency = formatCurrency;
        window._formatDate = formatDate;
        window._currentUser = currentUser;
        window._db = db;
        window._persistDB = persistDB;
        window._getDB = getDB;
        window._getOrInitDB = getOrInitDB;
        window._endActiveTrip = window._endActiveTrip;
        window._triggerSOS = window._triggerSOS;
        window._placeOrder = window._placeOrder;
        window._updateOrderStatus = window._updateOrderStatus;
        window._viewInvoice = window._viewInvoice;
        window._filterFishListings = window._filterFishListings;
        window._markRead = window._markRead;
        window._markAllRead = window._markAllRead;
        window._showAddCatchModal = window._showAddCatchModal;
        window._saveCatch = window._saveCatch;
        window._editCatch = window._editCatch;
        window._deleteCatch = window._deleteCatch;
        window._showAddExpenseModal = window._showAddExpenseModal;
        window._saveExpense = window._saveExpense;
        window._deleteExpense = window._deleteExpense;
        window._showAddListingModal = window._showAddListingModal;
        window._saveListing = window._saveListing;
        window._editListing = window._editListing;
        window._deleteListing = window._deleteListing;
        window._saveBoat = window._saveBoat;
        window._editBoat = window._editBoat;
        window._deleteBoat = window._deleteBoat;
        window._startTrip = window._startTrip;
        window._updateProfile = window._updateProfile;

        // Start the app
        init();
        console.log("🐟 FisherConnect initialized successfully!");
        console.log(
          "Demo credentials: admin@fisherconnect.com/admin123 | ravi@fisher.com/fisher123 | buyer@market.com/buyer123",
        );
      })();
      // ========== BACKEND API INTEGRATION ==========
      const API_URL = "https://fisherconnect-production.up.railway.app/api";

      function getToken() {
        return sessionStorage.getItem("jwt_token");
      }

      async function apiFetch(url, options = {}) {
        const token = getToken();
        const headers = {
          "Content-Type": "application/json",
          ...(token && { Authorization: `Bearer ${token}` }),
          ...options.headers,
        };
        const response = await fetch(API_URL + url, { ...options, headers });
        if (!response.ok) {
          const err = await response.text();
          throw new Error(err);
        }
        const text = await response.text();

        try {
          return JSON.parse(text);
        } catch {
          return text;
        }
      }
    </script>
  </body>
</html>
